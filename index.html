    linear-gradient(180deg, hsl(235, 16%, 14%) 0%, hsl(245, 18%, 16%) 70%, hsl(265, 22%, 18%) 100%);
  background-repeat: no-repeat, repeat, no-repeat;
  background-position: right -160px bottom 0, top center, center;
  background-size: auto 168px, auto, cover;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.5rem;
  overflow-x: hidden;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.container {
  flex: 1;
  width: 100%;
  max-width: 688px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-bottom: 5rem;
}

.heading {
  font-size: 1.285rem;
  line-height: 1.4;
  letter-spacing: 0.33em;
  text-transform: uppercase;
  text-align: center;
  color: var(--white);
  margin-bottom: 3.8rem;
  max-width: 100%;
}

.countdown {
  display: grid;
  grid-template-columns: repeat(4, var(--card-width));
  gap: 1.15rem;
  justify-content: center;
}

.countdown-item {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.flip-card {
  position: relative;
  width: var(--card-width);
  height: var(--card-height);
  border-radius: var(--card-radius);
  box-shadow: 0 var(--card-shadow) 0 0 var(--slate-900);
  perspective: 450px;
  user-select: none;
}

/* Side notches at vertical midpoint */
.flip-card::before,
.flip-card::after {
  content: '';
  position: absolute;
  top: 50%;
  width: var(--notch-size);
  height: calc(var(--notch-size) * 2);
  background-color: var(--slate-900);
  transform: translateY(-50%);
  z-index: 10;
}

.flip-card::before {
  left: 0;
  border-top-right-radius: var(--notch-size);
  border-bottom-right-radius: var(--notch-size);
}

.flip-card::after {
  right: 0;
  border-top-left-radius: var(--notch-size);
  border-bottom-left-radius: var(--notch-size);
}

.card-half {
  position: absolute;
  left: 0;
  width: 100%;
  height: 50%;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.card-half span {
  position: absolute;
  left: 0;
  width: 100%;
  height: var(--card-height);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--digit-size);
  line-height: 1;
  letter-spacing: -0.03em;
  color: var(--pink-100);
}

.card-half.top,
.card-half.flip-top {
  top: 0;
  background-color: var(--slate-750);
  border-top-left-radius: var(--card-radius);
  border-top-right-radius: var(--card-radius);
  border-bottom: 1px solid hsla(234, 17%, 12%, 0.45);
}

.card-half.top span,
.card-half.flip-top span {
  top: 0;
  filter: brightness(0.92);
}

.card-half.bottom,
.card-half.flip-bottom {
  bottom: 0;
  background-color: var(--slate-700);
  border-bottom-left-radius: var(--card-radius);
  border-bottom-right-radius: var(--card-radius);
}

.card-half.bottom span,
.card-half.flip-bottom span {
  bottom: 0;
}

/* 3D Flip overlays */
.card-half.flip-top {
  transform-origin: bottom center;
  z-index: 4;
  animation: flip-top 280ms ease-in forwards;
}

.card-half.flip-bottom {
  transform-origin: top center;
  transform: rotateX(90deg);
  z-index: 5;
  animation: flip-bottom 280ms ease-out 280ms forwards;
}

@keyframes flip-top {
  0% {
    transform: rotateX(0deg);
  }
  100% {
    transform: rotateX(-90deg);
  }
}

@keyframes flip-bottom {
  0% {
    transform: rotateX(90deg);
  }
  100% {
    transform: rotateX(0deg);
  }
}

.unit-label {
  margin-top: 1.05rem;
  font-size: 0.5rem;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--lavender-300);
  text-align: center;
  padding-left: 0.4em;
}

/* Footer & Social Icons */
.site-footer {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 1.25rem;
  gap: 1.5rem;
}

.social-links {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2.25rem;
  margin-bottom: 1.2rem;
}

.social-link {
  color: var(--lavender-300);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: color 180ms ease, transform 180ms ease;
  border-radius: 4px;
}

.social-link:hover {
  color: var(--pink-100);
}

.social-link:focus-visible {
  color: var(--pink-100);
  outline: 2px solid var(--pink-100);
  outline-offset: 4px;
}

.attribution {
  font-size: 0.785rem;
  text-align: center;
  color: var(--lavender-300);
  opacity: 0.75;
}

.attribution a {
  color: var(--lavender-300);
  text-decoration: underline;
  text-underline-offset: 2px;
  transition: color 180ms ease;
}

.attribution a:hover,
.attribution a:focus-visible {
  color: var(--pink-100);
}

/* Desktop Breakpoint */
@media (min-width: 768px) {
  :root {
    --card-width: 148px;
    --card-height: 140px;
    --card-radius: 8px;
    --card-shadow: 10px;
    --notch-size: 8px;
    --digit-size: 5.714rem;
  }

  body {
    background-position: bottom center, top center, center;
    background-size: 100% 197px, auto, cover;
  }

  .container {
    padding-bottom: 6.5rem;
  }

  .heading {
    font-size: 1.57rem;
    letter-spacing: 0.33em;
    max-width: none;
    margin-bottom: 7.4rem;
  }

  .countdown {
    gap: 2.285rem;
  }

  .unit-label {
    margin-top: 1.85rem;
    font-size: 1rem;
    letter-spacing: 0.42em;
    padding-left: 0.42em;
  }

  .site-footer {
    padding-bottom: 1.5rem;
    gap: 2rem;
  }

  .social-links {
    margin-bottom: 1.5rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  .card-half.flip-top,
  .card-half.flip-bottom {
    animation-duration: 0.01ms;
    animation-delay: 0ms;
  }
}

  <script>
const INITIAL_DAYS = 14;
const MS_PER_SECOND = 1000;
const MS_PER_MINUTE = MS_PER_SECOND * 60;
const MS_PER_HOUR = MS_PER_MINUTE * 60;
const MS_PER_DAY = MS_PER_HOUR * 24;

const targetTimestamp = Date.now() + INITIAL_DAYS * MS_PER_DAY;

const unitElements = {
  days: document.querySelector('[data-unit="days"] .flip-card'),
  hours: document.querySelector('[data-unit="hours"] .flip-card'),
  minutes: document.querySelector('[data-unit="minutes"] .flip-card'),
  seconds: document.querySelector('[data-unit="seconds"] .flip-card'),
};

const currentValues = {
  days: null,
  hours: null,
  minutes: null,
  seconds: null,
};

function formatTwoDigits(value) {
  return String(value).padStart(2, '0');
}

function setCardInstant(card, formattedValue) {
  const topSpan = card.querySelector('.top span');
  const bottomSpan = card.querySelector('.bottom span');
  const srValue = card.querySelector('[data-sr-value]');

  topSpan.textContent = formattedValue;
  bottomSpan.textContent = formattedValue;
  if (srValue) {
    srValue.textContent = formattedValue;
  }
}

function flipCard(card, previousValue, nextValue) {
  const staticTop = card.querySelector('.top span');
  const staticBottom = card.querySelector('.bottom span');
  const srValue = card.querySelector('[data-sr-value]');

  // Remove any leftover flip overlays from a previous tick
  card.querySelectorAll('.flip-top, .flip-bottom').forEach((el) => el.remove());

  const flipTop = document.createElement('div');
  flipTop.className = 'card-half flip-top';
  flipTop.setAttribute('aria-hidden', 'true');
  flipTop.innerHTML = `<span>${previousValue}</span>`;

  const flipBottom = document.createElement('div');
  flipBottom.className = 'card-half flip-bottom';
  flipBottom.setAttribute('aria-hidden', 'true');
  flipBottom.innerHTML = `<span>${nextValue}</span>`;

  // Static top immediately reveals the upcoming number behind the folding top flap
  staticTop.textContent = nextValue;
  // Static bottom holds the old number until the new bottom flap lands
  staticBottom.textContent = previousValue;

  if (srValue) {
    srValue.textContent = nextValue;
  }

  flipTop.addEventListener('animationend', () => {
    flipTop.remove();
  }, { once: true });

  flipBottom.addEventListener('animationend', () => {
    staticBottom.textContent = nextValue;
    flipBottom.remove();
  }, { once: true });

  card.append(flipTop, flipBottom);
}

function updateCountdown() {
  const remainingMs = Math.max(0, targetTimestamp - Date.now());
  const totalSeconds = Math.ceil(remainingMs / MS_PER_SECOND);

  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  const nextValues = {
    days: formatTwoDigits(days),
    hours: formatTwoDigits(hours),
    minutes: formatTwoDigits(minutes),
    seconds: formatTwoDigits(seconds),
  };

  Object.entries(nextValues).forEach(([unit, nextVal]) => {
    const card = unitElements[unit];
    if (!card) return;

    const prevVal = currentValues[unit];
    if (prevVal === null) {
      setCardInstant(card, nextVal);
    } else if (prevVal !== nextVal) {
      flipCard(card, prevVal, nextVal);
    }

    currentValues[unit] = nextVal;
  });

  if (totalSeconds === 0) {
    clearInterval(timerId);
  }
}

updateCountdown();
const timerId = setInterval(updateCountdown, 1000);

  </script>
